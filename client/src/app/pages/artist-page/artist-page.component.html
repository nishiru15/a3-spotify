@if(artist) {
	<div class="row">
		<div class="col-xl-4 col-12">
			<!--populate with artist name-->
			<h1>{{artist.name}}</h1>
			<!--populate with artist image URL-->
			<img id="artistImg" src="artist.imageURL">
			<p>
				<!--link to artist page on spotify, display artist name-->
				<a class="btn btn-light" role="button" target="_blank" [href] = "artist.url">Open {{artist.name}} on Spotify</a>
			</p>
		</div>
		<div class="col-xl-4 col-12">
			<h3>Popularity</h3>
			<!--TODO: display the number of followers, formatted with commas for thousands/millions-->
			<p>??? followers</p>
			<app-thermometer [popularity]="artist.popularity"></app-thermometer>
			<!--TODO: display artist name-->
			<h3>???'s Albums</h3>
			<!--TODO: Display a carousel component for the artist's albums. Bind carousel's resources and give it a static carouselId.-->
		</div>
		<div class="col-xl-4 col-12">
			<!--display artist name-->
			<h3>{{artists.name}}'s Top Tracks</h3>
			<!--display the artist's top tracks-->
			<app-track-list [tracks] = "topTracks" [hideArtist] = 'true'></app-track-list>
		</div>
	</div>
}
